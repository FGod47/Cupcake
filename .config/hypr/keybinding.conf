binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

$mainMod = SUPER
$sMod = SUPER + SHIFT
$aMod = ALT

bind = $mainMod, Q, exec, $terminal
bind = $mainMod ,F, exec, $browser
bind = $aMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, W, fullscreen, 1
bind = $mainMod, G, fullscreen, 0
bind = $mainMod, O, exec, obsidian /home/arcadian/Obsidian/ \Vault Notes.canvas
bind = $sMod, O,exec, obsidian
bind = $sMod, T, exec, [float; size 1000 500] $terminal

$key = tab
$mod = super


#Nautilus File Manager
bind = $mainMod, E, exec, $fileManager
#Quickshell Powermenu
bind = $mainMod, P, exec, quickshell -p ~/.config/quickshell/PowerMenu.qml
#AI Panel Toggle
bind = $mainMod, a, exec, quickshell ipc call aipanel toggle
#Rofi Launcher
bind = $mainMod, Space, exec, ~/.config/cupcake/scripts/toggle_app_launcher.sh
#Hotkeys cheat sheet
bind = $mainMod, SLASH, exec, ~/.config/cupcake/scripts/keybinds_hint.sh

# Toggle Cupcake Dark/Light Theme
bind = $mainMod, T, exec, ~/.config/cupcake/scripts/toggle_theme.sh

bind = $mainMod, C, exec, antigravity-ide

# Super + Print: Screenshot to clipboard with notification
#bind = $mainMod, Print, exec, bash -c 'grim -g "$(slurp)" /tmp/photo.png && swappy -f /tmp/photo.png'

# Super + Shift + Print: Screenshot to file with notification
bind = $sMod, Print, exec, bash -c 'mkdir -p $HOME/Pictures/Screenshot && file="$HOME/Pictures/Screenshot/$(date +%m-%d-%H-%M-%S).png" && grim -g "$(slurp)" "$file" && notify-send "Screenshot Saved" "$file" -i "$file"'

# Super + Print Screenshot
bind = $mainMod, Print, exec, ~/.config/cupcake/scripts/screenshot-edit.sh

# Screen recording with wf-recorder
bind = $sMod, J, exec, ~/.config/cupcake/scripts/record-screen.sh
bind = $sMod, K, exec, pkill wf-recorder

bind = ALT SHIFT, W, exec, ~/.config/cupcake/scripts/toggle_bar.sh
bind = $mainMod SHIFT, B, exec, ~/.config/cupcake/scripts/toggle_bar.sh
#Task Manager
bind = CTRL SHIFT, Tab, exec, $terminal $taskManager

#ColorPicker
bind = $mainMod, N, exec, $colorpicker -a

bind = $sMod, W, exec, ~/.config/cupcake/scripts/toggle_wallpaper.sh      #==> Select wallapers


#Volume Control
binde = , xf86audioraisevolume, exec, ~/.local/bin/volume.sh up
binde = , xf86audiolowervolume, exec, ~/.local/bin/volume.sh down
binde = , xf86AudioMute, exec, ~/.local/bin/volume.sh mute


#Player Control
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next


#Brightness Control
binde = , XF86MonBrightnessDown,exec,~/.local/bin/brightness.sh down
binde = , XF86MonBrightnessUp,exec,~/.local/bin/brightness.sh up

bind = $sMod, l, exec, ~/.local/share/quickshell-lockscreen/lock.sh

bind = ALT, Tab , cyclenext
bind = $mainMod, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev

#bind = $mainMod, Tab, workspace, e-2



# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, E, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Cupcake Settings App
bind = $mainMod, I, exec, quickshell -p ~/.config/quickshell/Settings.qml
