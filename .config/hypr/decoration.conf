# cupcake decoration style rules

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
    col.active_border = $primary $secondary 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = true
    layout = dwindle
}

decoration {
    dim_special = 0.3
    rounding = 10
    screen_shader = ~/.config/hypr/shaders/rounded_corners.glsl

    blur {
        special = true
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}