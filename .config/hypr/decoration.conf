# cupcake decoration style rules

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
    col.active_border = rgb(b4befe) rgb(f5c2e7) 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = true
    layout = dwindle
}

decoration {
    dim_special = 0.3
    rounding = 10

    blur {
        special = true
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}